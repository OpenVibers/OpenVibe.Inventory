## ═══════════════════════════════════════════════════════════════
## inventory.openvibe.network — Nginx configuration (REFERENCE)
##
## Deployed to /etc/nginx/sites-available/inventory.openvibe.network.conf (ov-vhost-install) — keep them in sync and reload
## nginx after changing it. The Node app (port 5030, systemd unit openvibe-inventory) renders every page and serves
## the API; nginx terminates TLS with the openvibe.network wildcard certificate (*.openvibe.network: a repo vhost uses
## the certificate that really covers its name, or Cloudflare answers 526), rate-limits sign-in, the API and the equip
## form, keeps /internal/ (OpenVibe.Events deliveries) off the internet, and compresses text. There is no www. name:
## the wildcard does not cover a second level.
##
## No proxy_cache: the app decides cacheability per response (public for the pages rendered for anonymous
## visitors; private, no-store for everything personal). Never log request bodies here.
## ═══════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=inventory_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=inventory_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=inventory_forms:10m rate=1r/s;

server {
    listen 80;
    listen [::]:80;
    server_name inventory.openvibe.network;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://inventory.openvibe.network$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name inventory.openvibe.network;

    ssl_certificate     /etc/letsencrypt/live/openvibe.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openvibe.network/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/inventory.openvibe.network.access.log;
    error_log  /var/log/nginx/inventory.openvibe.network.error.log;

    # The API's JSON body cap is 64 KB; leave room for the headers.
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/problem+json image/svg+xml text/plain application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Network SSO session endpoints ───────────────────────
    # The navbar's session probe runs on every page view: it gets the API's budget, not sign-in's.
    location = /auth/me {
        limit_req zone=inventory_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5030;
    }

    location /auth/ {
        limit_req zone=inventory_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5030;
    }

    # ── API ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=inventory_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5030;
    }

    # ── The equip form (POST /me/equip) ─────────────────────
    location = /me/equip {
        limit_req zone=inventory_forms burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5030;
    }

    # ── Prometheus metrics: host-local scrapers only (http://127.0.0.1:5030/metrics) ──
    location = /metrics { return 404; }

    # ── OpenVibe.Events' delivery route: loopback only (POST /internal/events) ──
    # Events posts to http://127.0.0.1:5030/internal/events directly; never proxied from outside (ADR-033).
    location /internal/ { return 404; }

    # ── Pages, docs, robots.txt, sitemap, static assets ─────
    location / {
        proxy_pass http://127.0.0.1:5030;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
